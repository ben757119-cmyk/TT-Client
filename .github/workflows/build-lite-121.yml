name: Build TT Client Lite 1.21.x

on:
  push:
    paths:
      - 'lite-1.21/**'
      - '.github/workflows/build-lite-121.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Wrapper + build
        working-directory: lite-1.21
        run: |
          gradle wrapper --gradle-version 8.12
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Collect jars for 1.21.1-1.21.11
        run: |
          mkdir -p dist
          JAR=$(ls lite-1.21/build/libs/*.jar | grep -v sources | grep -v javadoc | head -1)
          echo "Built: $JAR"
          cp "$JAR" dist/ttclient-neoforge-1.21.1.jar
          for v in 1.21.2 1.21.3 1.21.4 1.21.5 1.21.6 1.21.7 1.21.8 1.21.9 1.21.10 1.21.11; do
            cp dist/ttclient-neoforge-1.21.1.jar "dist/ttclient-neoforge-${v}.jar"
          done
          ls -la dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ttclient-neoforge-1.21-lite
          path: dist/*

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lite-1.21-${{ github.run_number }}
          name: TT Client Lite 1.21.x #${{ github.run_number }}
          files: dist/*
          prerelease: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
