name: Build TT Client

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:
  release:
    types: [ created ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Build with Gradle
        run: gradle build --no-daemon

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: ttclient-jar
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.4.0
          name: TT Client v1.4.0
          body: |
            ## TT Client 1.4.0 — Working modules

            Many modules now have real client-side behavior (not just toggles):

            **Movement:** Sprint, AutoWalk, Speed, Fly, Jesus, Step, Spider, Parkour, LongJump, ElytraFly
            **Combat:** KillAura, TriggerBot, AutoClicker
            **Player:** NoFall, AutoEat, AutoGapple, AutoFish, FastPlace
            **Render:** Fullbright, Zoom
            **Misc:** AntiAFK, AutoRespawn, CoordCopy, FPSBoost

            ClickGUI blur fix retained from 1.3.3.

            ### Install
            1. Remove older JARs
            2. Put `ttclient-1.4.0.jar` in `mods`
            3. Right Shift → enable modules
          files: build/libs/*.jar
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
