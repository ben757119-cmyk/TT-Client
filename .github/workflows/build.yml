name: Build TT Client

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:
  release:
    types: [ created ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Build with Gradle
        run: gradle build --no-daemon

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: ttclient-jar
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.3
          name: TT Client v1.3.3
          body: |
            ## TT Client 1.3.3

            ### ClickGUI fix
            - Disabled 26.2 menu blur (`extractBlurredBackground` no-op, solid fill only)
            - `isInGameUi()` forced true so vanilla never takes the blur path
            - **Actually draws** category panels again (previous builds only showed a blank/blur overlay)

            Requires NeoForge **26.2.0.75+**.

            ### Install
            1. Remove older ttclient JARs
            2. Put `ttclient-1.3.3.jar` in `mods`
            3. Press **Right Shift** — you should see neon panels, not just blur
          files: build/libs/*.jar
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
