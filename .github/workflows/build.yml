name: Build TT Client

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ttclient-jar
          path: build/libs/*.jar
          if-no-files-found: error
      - name: Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.7.0
          name: TT Client v1.7.0
          body: |
            ## TT Client 1.7.0
            - **Right Shift ClickGUI is sharp** — no vanilla 26.2 menu blur (`extractBlurredBackground` no-op, no `super.extractRenderState`)
            - ClickGUI search restored
            - New: AutoJump, DeathCoords
            - Removed empty stub modules (ChinaHat, Spammer, DiscordRPC, FakePlayer, etc.)
            - AttributeSwapper / AutoArmorSwap retained from 1.6.1
          files: build/libs/*.jar
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
