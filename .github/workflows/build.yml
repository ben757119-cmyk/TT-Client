name: Build TT Client

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:
  release:
    types: [ created ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Build with Gradle
        run: gradle build --no-daemon

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: ttclient-jar
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1
          name: TT Client v1.0.1
          body: |
            ## TT Client 1.0.1

            Built for **NeoForge 26.2.0.75+** / **Minecraft 26.2**.

            ### Fixes
            - Requires NeoForge **26.2.0.75** or above (was 26.2.0.87)
            - 20 new modules (55+ total)

            ### Install
            1. Install NeoForge 26.2 (0.75 or newer)
            2. Put `ttclient-1.0.1.jar` in your `mods` folder
            3. Press **Right Shift** in-game for ClickGUI
          files: build/libs/*.jar
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
